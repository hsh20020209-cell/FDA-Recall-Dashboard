:root{--bg:#f6f7fb;--c:#fff;--t:#1f2937;--m:#6b7280;--p:#2563eb;--b:#e5e7eb;--g:#16a34a;--y:#d97706;--r:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--t);line-height:1.5}
header{background:#fff;border-bottom:1px solid var(--b);padding:12px 16px;position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0}nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
button,select,textarea{font:inherit}nav button,.tabs button{border:1px solid var(--b);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
nav button.on,.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
main{max-width:1000px;margin:0 auto;padding:16px}.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:14px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.m{font-size:22px;font-weight:700}.s{color:var(--m);font-size:13px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;color:#fff}.HIGH{background:var(--g)}.MEDIUM{background:var(--y)}.LOW{background:var(--r)}
.bar{height:8px;background:#e5e7eb;border-radius:4px}.bar i{display:block;height:8px;background:var(--p);border-radius:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}table{width:100%;border-collapse:collapse;font-size:13px;display:block;overflow-x:auto}th,td{border-bottom:1px solid var(--b);padding:6px 8px;text-align:left;white-space:nowrap}
.warn{background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:8px 12px;font-size:13px}details{margin:8px 0}textarea,select{width:100%;padding:6px;border:1px solid var(--b);border-radius:6px}
.pri{background:var(--p);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}.pri:disabled{opacity:.4;cursor:not-allowed}.hid{display:none}
</style></head><body>

<details class="card"><summary>Confidence 검증 정보 (Validation / Test)</summary><p class="s">보정된 정답 확률이 아닌 검토 우선순위 신호입니다. HIGH ≥0.6 · MEDIUM 0.3~&lt;0.6 · LOW &lt;0.3</p>
<table><tr><th>구분</th><th>등급</th><th>건수</th><th>Coverage</th><th>Top-1 정확도</th><th>Top-3 Hit</th></tr>${D.seg.map(r=>`<tr><td>${r.split}</td><td>${r.confidence_level}</td><td>${r.n}</td><td>${P(r.coverage)}</td><td>${P(r.accuracy)}</td><td>${P(r.top3_hit_rate)}</td></tr>`).join('')}</table></details>`}
function past(c){const m=D.man;return `<div class="card"><h3>유사 과거 Recall Top-3</h3><div class="s">개시일 기준 필터링 · 유사도가 높아도 제품·용도 맥락을 함께 확인해야 합니다.</div>${c.sim.map(s=>`<div class="card"><b>#${s.rank} Event ${s.id}</b> · 유사도 ${s.sim.toFixed(3)} <span class="tag LOW" style="background:#6b7280">${E(s.rc)}</span><div class="s">${E(s.firm)} · ${E(s.date)}</div><p>${E(s.reason)}</p><div class="s"><b>과거 조치 이력</b> (현재 이슈의 권장 조치 아님): ${E(s.action)}</div></div>`).join('')}</div>
<details class="card"><summary>Retrieval 수동 평가 요약: GOOD ${m.query_quality.GOOD} · PARTIAL ${m.query_quality.PARTIAL} · POOR ${m.query_quality.POOR}</summary><p class="s">${E(m.notice)}</p><p class="s">${E(m.scope)}</p>
<table><tr><th>구분</th><th>사례</th><th>관찰</th></tr>${m.cases.map(x=>`<tr><td>${E(x.kind)}</td><td>${E(x.case)}</td><td style="white-space:normal">${E(x.observation)}</td></tr>`).join('')}</table></details>`}
function qa(c){const k=c.q.id,s=saved[k];return `<div class="card"><h3>QA 조사 체크리스트</h3>${c.check.items.map((i,n)=>`<label><input type="checkbox"> ${E(i)}</label><br>`).join('')}<p class="s">원본에서 사용자가 Recall 사유를 입력하던 부분은 사전 계산 사례로 대체되었습니다.</p></div>
<div class="card"><h3>QA Final Decision</h3><div class="s">AI Top-1은 자동 입력되지 않습니다. 직접 선택하세요.</div>
<label>최종 Root Cause</label><select id="fr" ${s?'disabled':''} onchange="chk()"><option value="">선택</option>${CL.map(x=>`<option ${s&&s.final==x?'selected':''}>${x}</option>`).join('')}</select>
<label>판단 근거 (필수)</label><textarea id="fc" rows="3" ${s?'disabled':''} oninput="chk()">${s?E(s.comment):''}</textarea>
<label id="cf" class="hid"><input type="checkbox" id="cfc" onchange="chk()"> AI 제안과 같은 원인이며, 직접 검토했음을 확인합니다</label><br>
<button class="pri" id="sv" onclick="save()" disabled>${s?'저장됨':'판단 저장'}</button> <span class="s">이력은 현재 브라우저 세션(새로고침 시 초기화)에서만 유지됩니다.</span></div>`}
function chk(){const c=D.cases[ci],f=$('#fr').value,t=$('#fc').value.trim(),same=f==c.top3[0].root_cause;$('#cf').classList.toggle('hid',!same);
$('#sv').disabled=saved[c.q.id]||!f||!t||(same&&!$('#cfc').checked)}
function save(){const c=D.cases[ci];const r={event:c.q.id,ai_top1:c.top3[0].root_cause,confidence:c.level,final:$('#fr').value,comment:$('#fc').value.trim(),time:new Date().toLocaleString('ko-KR')};saved[c.q.id]=r;hist.push(r);draw()}
function history(){const q=(window._q||'').toLowerCase(),rows=hist.filter(r=>JSON.stringify(r).toLowerCase().includes(q));
return `<div class="card"><h3>QA 판단 이력</h3><input id="hq" placeholder="검색" value="${E(window._q||'')}" oninput="window._q=this.value;draw();$('#hq').focus()" style="width:100%;padding:6px">
${rows.length?`<table><tr><th>Event</th><th>AI Top-1</th><th>Conf.</th><th>QA 최종</th><th>근거</th><th>시각</th></tr>${rows.map(r=>`<tr><td>${r.event}</td><td>${E(r.ai_top1)}</td><td>${r.confidence}</td><td>${E(r.final)}</td><td style="white-space:normal">${E(r.comment)}</td><td>${E(r.time)}</td></tr>`).join('')}</table><button class="pri" onclick="csv()">CSV 내보내기</button>`:'<p class="s">저장된 판단이 없습니다.</p>'}</div>`}
function csv(){const h=Object.keys(hist[0]),b='\ufeff'+[h,...hist.map(r=>h.map(k=>'"'+String(r[k]).replace(/"/g,'""')+'"'))].map(r=>r.join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:'text/csv'}));a.download='qa_session_decisions.csv';a.click()}
function intro(){const I=[["시스템 목적","AI와 과거 FDA Recall 근거를 제공해 Human QA의 초기 조사와 최종 판단을 지원"],["Workflow","이슈 입력 → Root Cause Top-3 → Confidence → 유사 Recall → QA 검토 → Human QA 최종 판단 → 요약/Next Action"],["Human QA Principle","AI는 근거를 제시하고, 최종 판단은 Human QA가 수행"]];
return `<div class="grid">${I.map(x=>`<div class="card"><b>${x[0]}</b><p class="s">${x[1]}</p></div>`).join('')}</div>
<div class="card"><h3>해석 원칙</h3><p>Confidence는 검토 우선순위 신호이며 보정된 정답 확률이 아닙니다(ECE 0.0522). 높은 유사도는 참고할 만하다는 뜻일 뿐이며, 과거 조치는 권장·확정 조치가 아닙니다.</p></div>
<div class="card"><h3>핵심 결과 (final-v3)</h3><p>Test Accuracy 50.48% · Macro F1 0.4496 · Top-3 Hit 89.92% (Train 13,645 / Valid 1,338 / Test 1,042)</p><h3>프로젝트 Root Cause 7-class</h3>${CL.map(x=>`<span class="tag" style="background:#475569">${x}</span> `).join('')}</div>
<div class="card"><h3>한계</h3><ul><li>정적 HTML에서는 신규 입력에 대한 실시간 분류·검색을 하지 않고 사전 계산 사례 3건만 보여줍니다.</li><li>검색 평가는 작성자 1인의 수동 평가입니다.</li><li>QA 판단 이력은 세션 전용이며 감사 추적이 아닙니다.</li><li>데이터 출처: openFDA Medical Device Recall. FDA의 공식 판단이 아닙니다.</li></ul></div>`}
draw();
</script></body></html>
